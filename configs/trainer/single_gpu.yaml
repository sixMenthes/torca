default_root_dir: ${paths.output_dir}
min_epochs: 1
max_epochs: 60

accelerator: gpu
devices: 1
enable_checkpointing: True
enable_model_summary: False
enable_progress_bar: True

num_sanity_val_steps: 0
limit_val_batches: 1.0
#limit_val_batches: 0
barebones: False
check_val_every_n_epoch: 5

strategy: auto 
deterministic: False

gradient_clip_val: null
accumulate_grad_batches: 1
#precision: 16
# "bf16-mixed", not "bf16". Lightning maps the bare alias to the same thing but warns
# that it is kept "for historical reasons"; naming it explicitly says what it actually
# is, which is mixed precision with bf16 compute and fp32 master weights, not pure bf16.
precision: bf16-mixed
