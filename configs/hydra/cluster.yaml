# No colorlog here, unlike hydra/workstation.yaml. Batch output is redirected to
# logs/slurm/%x_%j.out, where ANSI colour codes are not colour — they are literal
# ESC[32m noise in the middle of every line. It also made hydra-colorlog a hard
# dependency of every cluster job: the plugin is resolved during config composition,
# so if it is missing the job dies seconds after it finally reaches the front of the
# queue, and you pay the whole wait again to find out.
#
# Nothing else changes: hydra's default logging writes the same records.

job:
  chdir: True
run:
  dir: ${paths.scratch_dir}/runs/${task_name}/${data.dataset.name}/${module.network.name}/${now:%Y-%m-%d_%H%M%S}
sweep:
  dir: ${paths.scratch_dir}/runs/${task_name}/multiruns/${data.dataset.name}/${module.network.name}/${now:%Y-%m-%d_%H%M%S}
  subdir: ${hydra.job.num}