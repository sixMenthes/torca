# @package _global_
# EMA self-distillation domain adaptation. Self-supervised: no labels, so no
# module/loss and no module/metric group — the objective lives in MIMDistillation and
# the readout is a separate linear probe (probe.py) over the adapted features.
#
# Swap the backbone arm with:  module/network=mim_distillation_beats
# NOTE: _self_ is LAST, unlike fsqnet.yaml. Hydra applies the defaults list in order,
# so with _self_ first the group files would win and the overrides below would be
# silently ignored (adamw.yaml's lr=1e-3 instead of the 1e-4 this task wants).
defaults:
  - callbacks: selfdistill
  # Per-backbone because the dataset now applies the fbank, and the two backbones need
  # different ones. Swap BOTH this and module/network together — the datamodule raises
  # if their sample rates disagree.
  - data/dataset: dclde_selfdistill_birdmae
  # NOT default: that one is num_workers=1, batch_size=1 (debug values)
  - data/loaders: selfdistill
  - data/transform: ssl_fbank_dclde
  - logger: mlflow
  - hydra: workstation
  - module/network: mim_distillation
  - module/optimizer: adamw
  - paths: workstation
  - trainer: single_gpu
  - experiment: null
  - _self_

# One MLflow experiment per ablation cell. The shared logger/mlflow.yaml still says
# "Finetune with no pre-training", which would dump every self-distillation run into the
# finetune experiment; overriding here rather than editing the shared file keeps the
# finetune runs untouched. task_name is set per arm by slurm/selfdistill/selfdistill.sh
# (selfdistill_birdmae / selfdistill_beats / selfdistill_birdmae_nobg).
logger:
  experiment_name: ${task_name}

# Select checkpoints on the held-out recording condition rather than just keeping the
# latest epoch. val/loss is the same objective computed on CarmanahPt, which the model
# never adapts on.
callbacks:
  model_checkpoint:
    monitor: val/loss
    mode: min
    save_top_k: 1
    save_last: true

module:
  optimizer:
    # Cosine schedule with warmup. Warmup matters more than usual here: at the sharp
    # codebook temperature an untrained projector is confidently wrong, so the first
    # steps carry large gradients.
    scheduler: true
    warmup_ratio: 0.067
    target:
      lr: 1e-4        # adaptation, not from-scratch pretraining — keep it low

seed: 59

start_time: ${now:%Y-%m-%d_%H%M%S}
task_name: "selfdistill"

train: true
test: false
