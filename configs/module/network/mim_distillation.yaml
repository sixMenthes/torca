# EMA self-distillation (iBOT-shaped, FSQ targets) — Bird-MAE arm.
# The BEATs arm is mim_distillation_beats.yaml; the ONLY differences there are the
# backbone and its native sample rate, which is the point: one recipe on both
# backbones makes adaptation a homogeneous on/off treatment instead of a confound.
name: MIMDistillation

# Read by data/transform/ssl_fbank_dclde.yaml, so the dataset resamples to whatever
# the backbone was pretrained at (Bird-MAE 32 kHz, BEATs 16 kHz).
sampling_rate: 32000

encoder:
  name: BirdMAE
  target_length: ${data.transform.target_length}
  sample_rate: ${module.network.sampling_rate}
  num_mel_bins: 128
  fbank_mean: ${data.dataset.mean}
  fbank_std: ${data.dataset.std}
  pretrained_weights_path: /home/tundra/projects/torca/pretrained/Bird-MAE-B

tokenizer:
  # The FSQ paper's recommended level set for a 2^10 target, chosen to sit near BEATs'
  # own ~1024-entry acoustic-tokenizer codebook so vocabulary size is comparable.
  # (8,6,5)=240 was the paper's 2^8 config and is what every measurement before
  # 2026-08-06 used — nothing at 240 is comparable to a run at 1000.
  #
  # tau does NOT need re-deriving: it scales as (1/max_d(levels_d//2))^2, set by the
  # FINEST axis, and the 8-axis gives 4 in both configs. That is not automatic —
  # [8,8,8] has the same tau but pushes the perfect-student CE floor from 0.59 to
  # 1.23, because every axis then sits at the finest spacing.
  #
  # Measured floor@tau=0.05 0.442, chance ln(1000)=6.908, ceiling log2(1000)=9.97,
  # bf16 index error 0.14% (unchanged from 240 — it is a boundary-rounding rate, not
  # a function of codebook size).
  #
  # NOTE the old comment here said to grow through prod(levels) rather than L, on the
  # grounds that more dimensions make the CE harder without adding resolution. That is
  # not what measurement shows: L=4 at these levels gives a LOWER floor than L=3 at
  # [8,8,8], because three coarse axes put non-neighbour codes further apart.
  levels: [8, 5, 5, 5]
  hidden_dim: 512

distill:
  mask_ratio: 0.6
  # Logits are -||z - code||^2 / temperature. At temperature=1 a PERFECT student still
  # pays CE 3.9 against a chance level of 5.5 (measured), i.e. the objective is mostly
  # an irreducible floor and the gradient is diffuse. 0.05 drops that floor to ~0.9.
  temperature: 0.05
  ema_decay: 0.996
  ema_decay_end: 0.9999      # ramped over training; null to hold ema_decay constant
  # Keep zero-padded positions out of the loss. Clips are already centred fixed-length
  # windows clamped at the file start, so padding appears only when the source file ends
  # first: measured train/valid_frac is 0.945, i.e. ~5% of positions, NOT the ~44% this
  # comment used to claim (that figure described an older annotation-length slicer).
  # Leave it on regardless — padding tokenises to one constant "silence" code, so even at
  # 5% it biases per-subset code histograms by however much clip durations differ, which
  # is what CodeUsageProbe compares.
  mask_padding: true
  ce_weight: 1.0
  # VICReg OFF as of 2026-08-07. Measured with ablate_terms.py, 2000 steps, four cells
  # over the two guards with everything else held fixed:
  #
  #   cell        token_bits_frac  codes_used      ce  masked_acc  vic_var  vic_cov
  #   ce                   0.0650        27.0  0.6049      0.9465   0.9249   0.0000
  #   ce+div               0.8274       992.0  2.6435      0.4363   0.1374   0.0039
  #   ce+vic               0.4729        78.0  1.1128      0.6966   0.0203   0.1791
  #   ce+vic+div           0.7465       914.0  2.2866      0.4688   0.0191   0.0874
  #
  # Two findings. VICReg cannot SEE the failure it was supposed to guard: in the `ce`
  # cell vic_cov reads a perfect 0.0000 while the tokenizer sits at 27 codes of 1000 —
  # the cube-corner saturation described in the diversity_weight comment below, now
  # measured rather than argued. And it is not free: adding it on top of the entropy
  # penalty LOWERS codebook usage (0.747 against 0.827) because the variance and
  # covariance constraints restrict where z can move, so the target ends up poorer.
  #
  # This costs nothing to reverse or to monitor. vicreg() is called unconditionally in
  # both training_step and validation_step and vic_parts is logged whatever the weights
  # are — the `ce` row above reports vic_var 0.9249 with both weights at zero. So the
  # terms remain FREE DIAGNOSTICS while being out of the gradient. What they still guard
  # against is dimensional collapse of the representation itself, which the entropy
  # penalty structurally cannot see because it only observes the code histogram: watch
  # train/vic_var, which sat at 0.1374 here, and set var_weight back to 1.0 if it climbs
  # materially above that on a production run.
  var_weight: 0.0
  cov_weight: 0.0
  # Complementary half of the variance decomposition: the global term can be satisfied
  # by between-clip spread alone, so this is what forbids "every token in this clip is
  # identical". Off by default; turn on if codebook_frac stays high but masked_acc is
  # suspiciously easy.
  within_clip_var_weight: 0.0
  gamma: 1.0
  # Entropy penalty on code usage. LFQ/MAGVIT-v2 form; wav2vec 2.0's diversity loss is
  # the ancestor. 0.0 = off, i.e. the objective as it was.
  #
  # Why it is needed: VICReg's variance term measures SPREAD, not coverage, and the
  # route from z to a code runs through tanh. Drive |z| up and every coordinate
  # saturates onto the same extreme, which gives huge per-dimension std (vic_var = 0)
  # and independent axes (vic_cov ~ 0) while every token lands on a cube CORNER.
  # Measured: 4 codes of 240, 0.43 bits of a 7.91-bit ceiling, both guards reading
  # healthy throughout. This term penalises that directly.
  # Swept at K=1000, 2000 steps, flat lr (0.0 / 0.1 / 0.3 / 1.0). 1.0 won on BOTH
  # axes at once — highest token entropy AND lowest CE, i.e. more information per
  # token and better predictability rather than one bought with the other:
  #
  #     W     token_bits  frac   codes  ce     masked_acc
  #     0.0   2.22        0.343      9  0.699  0.821   <- collapsed
  #     0.1   8.08        0.823    505  3.744  0.380
  #     0.3   7.07        0.677    365  3.603  0.463
  #     1.0   8.73        0.858    673  2.776  0.378
  #
  # Ceiling log2(1000)=9.97, chance ln(1000)=6.908, floor 0.442.
  # Caveats: n=1 per cell and the ordering is not monotonic (0.1 beats 0.3 on every
  # metric), so run-to-run variance is comparable to the gaps between neighbouring
  # weights — "1.0 is best" is provisional. Nothing had converged either; token_bits
  # was still climbing steeply at step 2000 everywhere. What IS robust is the gap
  # from 0.0: with the penalty off the tokenizer collapses to ~9 codes and
  # masked_acc 0.82, which is not a usable objective.
  # At K=240 weight 1.0 pinned token_bits_frac at 0.943 with every code in every
  # batch; at K=1000 it sits at 0.858 with 673 of 1000, so the larger codebook
  # bought real headroom rather than forced uniformity.
  #
  # That last sentence did not survive a full run. Over eighteen epochs at 1.0
  # (selfdistill_birdmae_2026-08-07_165712) token_bits_frac climbed from 0.858 at 2000
  # steps to 0.976, with all 1000 codes used every epoch and 889 of them in every batch,
  # so the headroom closed. The measurement that matters is CodeUsageProbe's, because it
  # says what the capacity is being spent ON:
  #
  #     val/code_bg_token_bits     9.60     Background clips only
  #     val/code_call_token_bits   9.49     vocalisation clips only
  #     val/code_bg_codes_used     1000 / 1000
  #     ceiling log2(1000)         9.97
  #
  # The codebook spends as much of itself representing NOISE as representing calls,
  # marginally more, and background clips alone saturate it. That is the concrete form
  # of the argument that a codebook with nothing held in reserve has capacity to spare
  # for recording condition, which is the confound the study exists to measure. Forcing
  # near-uniform usage also asserts something false about the data, where Background is
  # common and calls are rare.
  #
  # The 0.3 comparison has now run, and it argues for LEAVING THIS AT 1.0.
  #
  #   metric, at epoch 18            div=1.0   div=0.3
  #   train/token_bits_frac            0.976     0.965
  #   val/code_bg_site_mi_excess       0.511     0.727   <- worse
  #   val/probe_eco_1site              0.722     0.709
  #   train/masked_acc_epoch           0.138     0.201   <- better
  #   train/ce_epoch                   11.44      8.86
  #
  # Two things to take from it. The codebook does not drift open over training, it
  # saturates by EPOCH 2 (0.751 then 0.985 at weight 1.0, 0.696 then 0.958 at 0.3), so
  # the endpoints differ by one percent after a seventy percent cut to the weight — this
  # lever barely moves the quantity it was chosen for. And site information in the codes
  # went the WRONG way, which inverts the "spare capacity gets spent on channel"
  # reasoning that motivated the run. The plausible replacement reading is that strong
  # entropy pressure spreads codes in a way that decorrelates them from site, while
  # relaxing it lets the tokenizer cluster on natural structure, and in this dataset
  # recording chain is natural structure.
  #
  # So the indicated next probe of this lever is 3.0, not something lower. Use
  # DIVERSITY_WEIGHT rather than editing this line, because C3, C4 and C5 must all train
  # under whatever it says and an arm that silently disagrees is an uncontrolled
  # treatment.
  diversity_weight: 1.0
  # Weight on the E[H(q)] half of the LFQ form. OFF, unlike LFQ: at this sharp a
  # temperature per-token entropy is already ~0, so it adds nothing and dilutes the
  # coverage signal. Measured at 1.0 it INVERTS the ordering — a collapsed batch
  # scores better than a healthy one, because collapsed z sits far from most codes
  # and so has a sharper per-token softmax. Only useful in softer regimes.
  # Strip the recording-channel subspace out of the TEACHER's tokens before they are
  # quantised, so the FSQ targets cannot encode which hydrophone a clip came from.
  #
  # This is aimed at the same failure the birdmae_teacherbg arm is: C4's nuisance metric
  # rose from 0.902 frozen to 0.947 adapted, and CodeUsageProbe showed the target codes
  # carrying 0.51 bits of site information, so the cross-entropy was paying the student
  # to recover the hydrophone through the interference. teacherbg attacks that by making
  # the teacher's INPUT channel-mixed; this attacks it by removing the channel from the
  # teacher's REPRESENTATION. They are independent and can be read against each other.
  #
  # enabled: false leaves the objective bit-identical to today. Turn it on with the
  # birdmae_sitepca arm, not by editing this line, so the arms cannot disagree.
  site_projection:
    enabled: false
    # null means S-1, the full rank of the centred per-site mean matrix, which is
    # equivalent to subtracting each site's mean. NOT a small number: measured on
    # synthetic tokens with 12 sites, removing 4 of the 11 available directions left
    # site decodability at 1.000, and only k = S-1 moved it at all. Content survived
    # the full removal untouched. The sweep is in the module docstring.
    n_components: null
    # EMA rate on the running per-site means. They have to track the encoder, which
    # moves throughout training, rather than be estimated once at the start.
    momentum: 0.05
    # Projection stays OFF until every site seen has contributed this many batches.
    # Projecting on noisy means would corrupt the targets exactly while the codebook is
    # forming, which is epochs 1 and 2 — the codebook reaches its final entropy by
    # epoch 2, so there is no room to recover from a bad start there.
    warmup_steps: 50
    max_sites: 64
  diversity_sample_weight: 0.0
  # null = score coverage at the CE temperature. Counterintuitive but measured: at
  # 0.05 the ordering across healthy/16/4/1-code cases is monotonic with 0.60 of
  # separation and the largest gradient (1.4e-4); softening to 1.0 breaks monotonicity
  # and costs 10x the gradient. q_bar at a sharp temperature IS the code histogram,
  # which is the quantity we want; softening smears it toward uniform for any input.
  diversity_temperature: null
