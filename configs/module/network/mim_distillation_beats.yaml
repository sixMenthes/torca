# EMA self-distillation — BEATs arm. Identical recipe to mim_distillation.yaml;
# only the backbone and its native sample rate change.
name: MIMDistillation

sampling_rate: 16000          # BEATs' own fbank is 16 kHz

encoder:
  name: BEATs
  sample_rate: ${module.network.sampling_rate}
  # Use the plain SSL iter3 checkpoint, NOT iter3+AS20K: the study compares SSL to
  # SSL, and the AS20K-finetuned variant would smuggle supervised AudioSet labels in
  # as a confound.
  pretrained_weights_path: /home/tundra/projects/torca/pretrained/BEATs_iter3.pt
  # BEATs' own fbank normalisation, not DCLDE's — it ships with the checkpoint.
  fbank_mean: 15.41663
  fbank_std: 6.55582

tokenizer:
  # MUST match mim_distillation.yaml — see there for why [8,5,5,5]. Identical on both
  # arms or adaptation stops being a homogeneous treatment.
  levels: [8, 5, 5, 5]
  hidden_dim: 512

distill:
  mask_ratio: 0.6
  temperature: 0.05
  ema_decay: 0.996
  ema_decay_end: 0.9999
  mask_padding: true
  ce_weight: 1.0
  var_weight: 1.0
  cov_weight: 0.04
  within_clip_var_weight: 0.0
  gamma: 1.0
  # MUST stay identical to mim_distillation.yaml — one recipe on both backbones is what
  # makes adaptation a homogeneous on/off treatment rather than a second confound.
  # See that file for why the entropy penalty exists.
  # Swept on the Bird-MAE arm only; see mim_distillation.yaml for the numbers. Kept
  # identical here by necessity, not by assumption — one recipe on both backbones is
  # what makes adaptation a homogeneous treatment. If BEATs turns out to need a
  # different weight, that is a finding to report, not a knob to retune per arm.
  diversity_weight: 1.0
  diversity_sample_weight: 0.0
  diversity_temperature: null
