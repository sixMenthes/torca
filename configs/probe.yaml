# @package _global_
# Linear-probe evaluation of a representation — the readout stage of the study.
# Trains nothing except the probe itself, so what it reports is a property of the
# REPRESENTATION rather than of a fitted head.
#
#   python probe_selfdistill.py source=mfcc                       # non-neural floor
#   python probe_selfdistill.py source=frozen                     # unadapted control
#   python probe_selfdistill.py source=adapted ckpt_path=...      # adapted cell
#   python probe_selfdistill.py source=frozen 'layers=[0,3,7,11]' # depth sweep
#   python probe_selfdistill.py source=adapted ckpt_path=... seal_test=true
defaults:
  # Either per-backbone dataset works here: probing never builds a front-end from the
  # dataset config (the encoder applies its own, dispatching on input rank), so this
  # only supplies the split and the manifest name — identical in both files.
  - data/dataset: dclde_selfdistill_birdmae
  - data/loaders: default
  - data/transform: ssl_fbank_dclde
  - hydra: workstation
  - logger: mlflow
  - module/network: mim_distillation
  - paths: workstation
  - _self_

# mfcc | frozen | adapted
source: frozen
ckpt_path: null

# Leave the test split alone. USE THIS WHILE TUNING, and leave it false only for the
# final numbers.
#
# The reported task protocol fits on train and scores once on the sealed test
# hydrophones, so it cannot be run repeatedly without turning the test split into a
# hyperparameter search set: look at it, change the recipe, look again, and the number
# has stopped being evidence. With seal_test=true the ecotype probe instead runs
# GroupKFold by hydrophone WITHIN train, and the call-type probe is skipped entirely
# because its test mask is the sealed split and there is no honest substitute.
#
# The nuisance metric is unaffected either way. probe.probe_nuisance_background already
# masks on tags == "train", so hydrophone decodability from Background clips never
# touched test at all and is free to look at as often as you like. That matters: it is
# one of the two co-primary metrics and the only one the pretext diagnostics (token
# entropy, code usage, cross-entropy) cannot see, since all of those describe the
# tokenizer and none of them says whether adaptation moved the confound.
#
# Metric keys change with the flag, on purpose: a sealed run writes
# {cell}/task_ecotype_cvtrain and a reported run writes {cell}/task_ecotype, so the two
# cannot be overlaid in MLflow by accident. The sealed number reads HIGHER than the
# reported one even with folds grouped by site, because the backbone adapted on every
# hydrophone in the pool. It is a trend instrument, not a preview of the result.
seal_test: false

# Directory to write the extracted features to, for offline UMAP/t-SNE projection.
# null = off, which is the default because the files are tens of megabytes per cell.
#
# The projection has to happen SOMEWHERE OTHER than here. Fitting it inside this run
# would mean a UMAP per cell computed by a different process against a different
# random state, and the whole point of the figure is that every cell is projected the
# same way so the panels can be compared. Writing the features out and projecting them
# in one pass afterwards is what makes that possible; project_embeddings.py does it.
#
# Written as float16. That is lossy at about 1e-3 relative, which is irrelevant to a
# 2-D neighbour embedding and would NOT be acceptable for the probe numbers — those are
# computed here from the float32 originals and never read this file.
save_features: null

# Which encoder blocks to pool from. null = final output (the headline metric).
# A list sweeps depth: recording condition is a low-level property, so the confound
# plausibly sits in early blocks — watching nuisance decodability fall across depth
# after adaptation is a mechanism result, not just an endpoint.
layers: null

# How the probe's regularisation C is chosen. "train_cv" = GroupKFold by hydrophone
# within the train split (13 hydrophones, and the same procedure the call-type probe
# uses). "val" = score candidates on the val split instead — CarmanahPt alone, so
# selection rests on a single recording condition.
c_selection: train_cv

# Fold the low-SR hydrophones into the probe's TRAIN set. Off, and it should stay off:
# those sites are band-limited well below the backbone's input rate, so a clip from one
# is upsampled and carries a hard spectral cliff with silence above it — a per-site
# fingerprint that is trivially decodable and would inflate the nuisance metric for
# reasons that have nothing to do with the representation.
#
# The flag now also controls EXTRACTION, not just the fit. It always excluded them from
# every reported number (probe_split_protocol defaulted to False; the nuisance and
# call-type masks test tags == "train", which "low_sr" is not) — but the backbone ran a
# forward pass over them anyway and the features were discarded unread. That was most
# of the probe's wall-clock and none of its result.
include_low_sr: false

# Energy / CO2eq accounting. See configs/callbacks/emissions.yaml for why offline is
# the default and why `region` matters far more than the country code.
emissions:
  offline: true
  country_iso_code: CAN
  region: null
  measure_power_secs: 30

n_mfcc: 40
batch_size: 32
# Dataloader workers for FEATURE EXTRACTION (the GPU pass). Distinct from probe_n_jobs
# below, which parallelises the sklearn fits — the two stages are sequential, so they
# do not contend and both should be set to the core count.
num_workers: 4
device: cuda

# CV folds fitted in parallel. Folds are independent, and this loop was serial until
# 2026-08-09, at which point it was the dominant cost of a probe run rather than the
# GPU pass: C4 spent about three minutes extracting features and the C2 cell then ran
# past twenty minutes inside sklearn. lbfgs on 21k rows of 768 features, multinomial,
# max_iter=2000, five folds for ecotype and five more for the twelve-class nuisance
# probe, one after another on one core.
#
# Set it to the job's core count. -1 means every visible core, which is right inside a
# SLURM allocation and wrong on a shared login node.
#
# Nothing numerical changes: same folds, same seed, same solver, same tolerance, so
# results stay comparable with cells measured before this existed. Each worker is
# pinned to one BLAS thread, because otherwise the workers oversubscribe the cores and
# the contention costs more than the parallelism gains.
probe_n_jobs: 4

seed: 59

# Which ablation cell this run IS. Every probe cell logs the SAME metric keys
# (final/task_ecotype, final/nuisance_bg, ...), so putting all six in one experiment
# makes the comparison a single sorted table rather than six tabs — which is the whole
# point of the study, since the claim is about the difference between cells.
#
#   C0  mfcc                                   non-neural floor
#   C1  frozen  BEATs                          unadapted control
#   C2  frozen  BirdMAE                        unadapted control
#   C3  adapted BEATs                          selfdistill_beats checkpoint
#   C4  adapted BirdMAE                        selfdistill_birdmae checkpoint
#   C5  adapted BirdMAE, background.p=0.0      attribution control
#   C6  adapted BirdMAE, teacher background    the birdmae_teacherbg arm
#
# C5 and C6 pull in opposite directions on the same question and are worth reading as a
# pair. C5 removes cross-hydrophone noise from the student; C6 adds it to the teacher.
# If the de-confounding story as originally designed is right, C5 should show a WORSE
# nuisance figure than C4's 0.947. If the clean teacher was the problem — its target
# codes carry 0.51 bits of site information, so predicting them rewards channel
# recovery — then C5 should come in BETTER than C4 and C6 better still.
#
# Required for adapted cells and not merely cosmetic: C4 and C5 differ ONLY in the
# checkpoint, so without it their run names and task_names are identical and the two
# are indistinguishable in the table.
# A string rather than null because it becomes an MLflow tag value, and a one-off
# `python probe_selfdistill.py source=frozen` should not fail on a None tag.
cell: unlabelled

# task_name still names the emissions project and the hydra run dir, so it stays
# per-cell. It is the RUN name in MLflow, not the experiment.
task_name: "probe_${source}_${module.network.encoder.name}"
logger:
  experiment_name: selfdistill_probes
  run_name: ${cell}_${task_name}_${start_time}
  # Tags are what the UI filters and groups on, so the columns that distinguish cells
  # should not have to be parsed back out of a run name.
  tags:
    cell: ${cell}
    source: ${source}
    backbone: ${module.network.encoder.name}
    stage: probe

start_time: ${now:%Y-%m-%d_%H%M%S}
