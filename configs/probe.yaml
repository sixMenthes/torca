# @package _global_
# Linear-probe evaluation of a representation — the readout stage of the study.
# Trains nothing except the probe itself, so what it reports is a property of the
# REPRESENTATION rather than of a fitted head.
#
#   python probe_selfdistill.py source=mfcc                       # non-neural floor
#   python probe_selfdistill.py source=frozen                     # unadapted control
#   python probe_selfdistill.py source=adapted ckpt_path=...      # adapted cell
#   python probe_selfdistill.py source=frozen 'layers=[0,3,7,11]' # depth sweep
defaults:
  # Either per-backbone dataset works here: probing never builds a front-end from the
  # dataset config (the encoder applies its own, dispatching on input rank), so this
  # only supplies the split and the manifest name — identical in both files.
  - data/dataset: dclde_selfdistill_birdmae
  - data/loaders: default
  - data/transform: ssl_fbank_dclde
  - hydra: workstation
  - logger: mlflow
  - module/network: mim_distillation
  - paths: workstation
  - _self_

# mfcc | frozen | adapted
source: frozen
ckpt_path: null

# Which encoder blocks to pool from. null = final output (the headline metric).
# A list sweeps depth: recording condition is a low-level property, so the confound
# plausibly sits in early blocks — watching nuisance decodability fall across depth
# after adaptation is a mechanism result, not just an endpoint.
layers: null

# How the probe's regularisation C is chosen. "train_cv" = GroupKFold by hydrophone
# within the train split (13 hydrophones, and the same procedure the call-type probe
# uses). "val" = score candidates on the val split instead — CarmanahPt alone, so
# selection rests on a single recording condition.
c_selection: train_cv

# Fold the low-SR hydrophones into the probe's TRAIN set. Off, and it should stay off:
# those sites are band-limited well below the backbone's input rate, so a clip from one
# is upsampled and carries a hard spectral cliff with silence above it — a per-site
# fingerprint that is trivially decodable and would inflate the nuisance metric for
# reasons that have nothing to do with the representation.
#
# The flag now also controls EXTRACTION, not just the fit. It always excluded them from
# every reported number (probe_split_protocol defaulted to False; the nuisance and
# call-type masks test tags == "train", which "low_sr" is not) — but the backbone ran a
# forward pass over them anyway and the features were discarded unread. That was most
# of the probe's wall-clock and none of its result.
include_low_sr: false

# Energy / CO2eq accounting. See configs/callbacks/emissions.yaml for why offline is
# the default and why `region` matters far more than the country code.
emissions:
  offline: true
  country_iso_code: CAN
  region: null
  measure_power_secs: 30

n_mfcc: 40
batch_size: 32
num_workers: 4
device: cuda

seed: 59

# Which ablation cell this run IS. Every probe cell logs the SAME metric keys
# (final/task_ecotype, final/nuisance_bg, ...), so putting all six in one experiment
# makes the comparison a single sorted table rather than six tabs — which is the whole
# point of the study, since the claim is about the difference between cells.
#
#   C0  mfcc                                   non-neural floor
#   C1  frozen  BEATs                          unadapted control
#   C2  frozen  BirdMAE                        unadapted control
#   C3  adapted BEATs                          selfdistill_beats checkpoint
#   C4  adapted BirdMAE                        selfdistill_birdmae checkpoint
#   C5  adapted BirdMAE, background.p=0.0      attribution control
#
# Required for adapted cells and not merely cosmetic: C4 and C5 differ ONLY in the
# checkpoint, so without it their run names and task_names are identical and the two
# are indistinguishable in the table.
# A string rather than null because it becomes an MLflow tag value, and a one-off
# `python probe_selfdistill.py source=frozen` should not fail on a None tag.
cell: unlabelled

# task_name still names the emissions project and the hydra run dir, so it stays
# per-cell. It is the RUN name in MLflow, not the experiment.
task_name: "probe_${source}_${module.network.encoder.name}"
logger:
  experiment_name: selfdistill_probes
  run_name: ${cell}_${task_name}_${start_time}
  # Tags are what the UI filters and groups on, so the columns that distinguish cells
  # should not have to be parsed back out of a run name.
  tags:
    cell: ${cell}
    source: ${source}
    backbone: ${module.network.encoder.name}
    stage: probe

start_time: ${now:%Y-%m-%d_%H%M%S}
