# DCLDE split for the self-distillation domain-adaptation study.
# Revised 2026-08-07. Differs from DCLDE.yaml (the finetune split) in:
#   - the three-hydrophone test split (see below);
#   - clip_duration 5.0 -> 3.0 (tighter on call); pair with transform target_length=304.
# StrGeo* stay in TRAIN: with StrGeoS1 out of test, StraitofGeorgia (JASCO) vs
# StrGeo* (DFO_WDA) are different instrument/depth/time = different recording chains.
parquet_path: /home/tundra/projects/torca/ds/DCLDE_w_Buzzes.parquet
dataset_dir: ${paths.dataset_dir}
name: DCLDE_selfdistill_beats

# See dclde_selfdistill_birdmae.yaml for why this lives in the dataset config.
# BEATs' front-end scales the waveform by 2**15, does NOT mean-subtract, uses kaldi
# window defaults, and does no target_length padding — its frame count follows the
# clip. Requires sample_rate 16000, which the datamodule verifies.
model_name: BEATs

num_workers: 4

# Cache manifest written by prestage_clips.py and read by prepare_data. Named per
# clip_duration on purpose: clips are {start_ms}-{end_ms}.wav, so a 5s stage and a
# 3s stage share no files — a shared manifest name would let one masquerade as the
# other and the run would train on empty batches without erroring.
manifest_name: DCLDE_3secs.parquet

columns: ['ID', 'Soundfile', 'Provider', 'Dataset', 'Labels', 'FileBeginSec', 'FileEndSec', 'Duration', 'CalltypeCategory', 'Buzz', 'NewPath']

# These three lists MUST stay identical to dclde_selfdistill_birdmae.yaml. The two
# files exist only to select a different front-end, and the BEATs and Bird-MAE cells
# are compared directly to each other — if the splits drift apart, that comparison is
# between two different experiments and nothing says so. The full rationale for each
# entry (why three test sites, why two val sites, why the online probe is pinned to one)
# lives in the birdmae file; it is not repeated here so that there is one place to
# change it. report_splits.py prints the split for whichever config you pass, so run it
# on both if you ever edit either.
test_hydros: ["StraitofGeorgia", "CarmanahPt", "BarkleyCanyon"]

val_hydros: ["Cpe_Elz", "StrGeoS1"]

online_probe_hydro: StrGeoS1

low_sr_hydros: ['NorthBc', 'WVanIsl', 'orcasound_lab', 'MS_671879205', 'Field_HTI', 'KB_67383303', 'RB_335826997', 'KB_67424266', 'HE_67424266', 'RB_67424266', 'HE_67391498', 'MS_6897', 'KB_5354', 'MS_5360', 'Field_SondTrap']

# Adaptation-pool balancing. MUST match dclde_selfdistill_birdmae.yaml, which carries
# the full rationale and the measured numbers; the BEATs and Bird-MAE cells are compared
# to each other, so a different pool here would make that a comparison between two
# experiments.
max_clips_per_hydro: 10000
max_bank_clips_per_hydro: 1000
subsample_seed: 59

labels: ['Background', 'HW', 'SRKW', 'TKW']
num_classes: 4

calls: ['S42', 'S03', 'S10', 'S44', 'S05', 'S06', 'S14', 'S18', 'S12', 'S19', 'S13', 'S04', 'S17', 'S41', 'S02', 'S01', 'S07', 'S08', 'S36', 'S16', 'S37']

num_calls: 21

class_to_balance: {}

# BEATs' OWN normalisation constants, which ship with the checkpoint and are what
# `BEATs.preprocess` applies. They are on a completely different scale from Bird-MAE's
# because BEATs multiplies the waveform by 2**15 before the fbank and does not
# mean-subtract it, so its log-mel energies are large and positive.
#
# These replace -45.198 / 14.855, which were this project's own statistics MEASURED
# THROUGH THE BIRD-MAE FRONT-END and were never meaningful here. They were harmless only
# for as long as nothing read them: until 2026-08-10 the datamodule built the front-end
# without passing mean or std, so BEATsFbank fell back to these same correct defaults.
# Now that the dataset config is the single source of truth for both front-ends, a wrong
# value here would be applied rather than ignored.
mean: 15.41663
std: 6.55582
clip_duration: 3.0
target_length: ${data.transform.target_length}
