root_dir: ${oc.env:PROJECT_ROOT}
work_dir: ${hydra:runtime.cwd}

#output
output_dir: ${hydra:runtime.output_dir}

# Staged 3s clips + the DCLDE_3secs.parquet manifest. Override per machine with the
# env var rather than on the command line: a dropped `paths.dataset_dir=` (one lost
# backslash in a multi-line paste) silently falls back to this value, and before
# prepare_data grew its guard that meant a 206k-clip re-download.
dataset_dir: ${oc.env:TORCA_DATA_DIR,/data/dclde_mim}
model_dir: ${paths.output_dir}/checkpoints/
log_dir: ${paths.output_dir}/logs/

# ONE MLflow store for the whole machine. This USED to be derived from log_dir,
# i.e. from output_dir, i.e. from the per-run hydra directory — so every run wrote
# a private store containing exactly one run and nothing could ever be compared in
# the UI. paths/cluster.yaml already got this right ("shared MLflow store across
# runs"); the two files had simply diverged.
# Env var so a second checkout or a merged store can be pointed at without an
# override that a dropped backslash can silently eat.
mlflow_dir: ${oc.env:TORCA_MLFLOW_DIR,${paths.root_dir}/mlruns}



